<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080202"/>
      <stop offset="50%" stop-color="#140404"/>
      <stop offset="100%" stop-color="#050101"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Ambient Glow -->
  <circle cx="680" cy="180" r="160" fill="#3D0000" opacity="0.3" filter="url(#glow)"/>
  <circle cx="150" cy="350" r="140" fill="#FF0000" opacity="0.08" filter="url(#glow)"/>

  <!-- GUI App Window Frame -->
  <rect x="60" y="40" width="680" height="420" rx="16" fill="#0d0303" stroke="#3D0000" stroke-width="1.5"/>

  <!-- Window Titlebar -->
  <path d="M 60 56 Q 60 40 76 40 L 724 40 Q 740 40 740 56 L 740 80 L 60 80 Z" fill="#180505"/>
  <circle cx="85" cy="60" r="5" fill="#FF0000"/>
  <circle cx="105" cy="60" r="5" fill="#950101"/>
  <circle cx="125" cy="60" r="5" fill="#3D0000"/>
  <text x="400" y="65" fill="#e4e4e7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Multi-Format Universal Converter (Python · Tkinter · Pillow)</text>

  <!-- Supported Formats Badges Bar -->
  <g font-family="monospace" font-size="10">
    <rect x="90" y="95" width="55" height="22" rx="4" fill="#3D0000" stroke="#FF0000" stroke-width="0.7"/>
    <text x="117" y="110" fill="#ffffff" text-anchor="middle">.PDF</text>

    <rect x="155" y="95" width="55" height="22" rx="4" fill="#3D0000" stroke="#FF0000" stroke-width="0.7"/>
    <text x="182" y="110" fill="#ffffff" text-anchor="middle">.DOCX</text>

    <rect x="220" y="95" width="55" height="22" rx="4" fill="#3D0000" stroke="#FF0000" stroke-width="0.7"/>
    <text x="247" y="110" fill="#ffffff" text-anchor="middle">.XLSX</text>

    <rect x="285" y="95" width="55" height="22" rx="4" fill="#3D0000" stroke="#FF0000" stroke-width="0.7"/>
    <text x="312" y="110" fill="#ffffff" text-anchor="middle">.PNG</text>

    <rect x="350" y="95" width="55" height="22" rx="4" fill="#3D0000" stroke="#FF0000" stroke-width="0.7"/>
    <text x="377" y="110" fill="#ffffff" text-anchor="middle">.JPG</text>

    <rect x="415" y="95" width="55" height="22" rx="4" fill="#3D0000" stroke="#FF0000" stroke-width="0.7"/>
    <text x="442" y="110" fill="#ffffff" text-anchor="middle">.WEBP</text>

    <rect x="480" y="95" width="55" height="22" rx="4" fill="#3D0000" stroke="#FF0000" stroke-width="0.7"/>
    <text x="507" y="110" fill="#ffffff" text-anchor="middle">.CSV</text>

    <rect x="545" y="95" width="65" height="22" rx="4" fill="#200606" stroke="#3D0000" stroke-width="0.7"/>
    <text x="577" y="110" fill="#a1a1aa" text-anchor="middle">+ 15 More</text>
  </g>

  <!-- Batch Queue Container -->
  <rect x="90" y="135" width="620" height="240" rx="10" fill="#140404" stroke="#3D0000" stroke-width="1"/>
  
  <!-- Queue Header -->
  <rect x="90" y="135" width="620" height="32" rx="10" fill="#200606"/>
  <text x="110" y="156" fill="#FF0000" font-family="monospace" font-size="11" font-weight="bold">SOURCE FILE</text>
  <text x="330" y="156" fill="#FF0000" font-family="monospace" font-size="11" font-weight="bold">TARGET FORMAT</text>
  <text x="490" y="156" fill="#FF0000" font-family="monospace" font-size="11" font-weight="bold">OUTPUT SIZE</text>
  <text x="640" y="156" fill="#FF0000" font-family="monospace" font-size="11" font-weight="bold">STATUS</text>

  <!-- Queue Items -->
  <g font-family="sans-serif" font-size="12">
    <!-- Row 1 -->
    <text x="110" y="195" fill="#ffffff">Architecture_Report_Q3.docx</text>
    <text x="330" y="195" fill="#a1a1aa">Portable Document (.pdf)</text>
    <text x="490" y="195" fill="#ffffff">1.4 MB</text>
    <text x="640" y="195" fill="#22c55e" font-family="monospace" font-weight="bold">DONE</text>

    <!-- Row 2 -->
    <text x="110" y="235" fill="#ffffff">Raw_Dataset_Telemetry.xlsx</text>
    <text x="330" y="235" fill="#a1a1aa">Comma Separated (.csv)</text>
    <text x="490" y="235" fill="#ffffff">820 KB</text>
    <text x="640" y="235" fill="#22c55e" font-family="monospace" font-weight="bold">DONE</text>

    <!-- Row 3 -->
    <text x="110" y="275" fill="#ffffff">Character_Art_Render.png</text>
    <text x="330" y="275" fill="#a1a1aa">WebP High Quality (.webp)</text>
    <text x="490" y="275" fill="#ffffff">340 KB</text>
    <text x="640" y="275" fill="#22c55e" font-family="monospace" font-weight="bold">DONE</text>

    <!-- Row 4 -->
    <text x="110" y="315" fill="#ffffff">Presentation_Slides.pdf</text>
    <text x="330" y="315" fill="#a1a1aa">High-Res PNG Sequence (.png)</text>
    <text x="490" y="315" fill="#ffffff">4.8 MB</text>
    <text x="640" y="315" fill="#22c55e" font-family="monospace" font-weight="bold">DONE</text>

    <!-- Row 5 -->
    <text x="110" y="355" fill="#ffffff">Database_Export.json</text>
    <text x="330" y="355" fill="#a1a1aa">Excel Spreadsheet (.xlsx)</text>
    <text x="490" y="355" fill="#ffffff">120 KB</text>
    <text x="640" y="355" fill="#22c55e" font-family="monospace" font-weight="bold">DONE</text>
  </g>

  <!-- Bottom Action Bar -->
  <rect x="90" y="395" width="620" height="45" rx="8" fill="#180505" stroke="#3D0000" stroke-width="1"/>
  <text x="110" y="423" fill="#22c55e" font-family="monospace" font-size="12">✓ Batch conversion completed: 5 files processed (0 errors)</text>
  <rect x="580" y="405" width="115" height="26" rx="13" fill="#FF0000"/>
  <text x="637" y="422" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Open Folder</text>
</svg>
